<!DOCTYPE html>
<html>
<head>
<title>Edit Profile</title>
<style>
body{
  background:#0b0e11;
  color:white;
  font-family:'Inter';
  padding:40px;
}

.card{
  background:#11181e;
  width:350px;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.card img{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#1a2024;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#0dd9e7;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
  <img id="profileImg" src="defaultpfp.png">

  <input id="editName" placeholder="New Username">
  <input id="editEmail" placeholder="New Email">

  <h3>Change Profile Picture</h3>
  <input type="file" id="uploadPfp" accept="image/*">

  <button onclick="saveProfile()">Save Changes</button>
  <button style="background:#444;" onclick="goBack()">Cancel</button>
</div>

<script>
const name = localStorage.getItem("fadss_logged_user");
const email = localStorage.getItem("fadss_logged_email");
const savedImg = localStorage.getItem("fadss_profile_img");

if (!name) window.location.href = "login.html";

document.getElementById("editName").value = name;
document.getElementById("editEmail").value = email || "";

if (savedImg) {
  document.getElementById("profileImg").src = savedImg;
}

let newPfp = savedImg;

// handle image upload
document.getElementById("uploadPfp").addEventListener("change", function(e){
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(){
    newPfp = reader.result;
    document.getElementById("profileImg").src = newPfp;
  };
  reader.readAsDataURL(file);
});

// save profile changes
function saveProfile(){
  const newName = document.getElementById("editName").value.trim();
  const newEmail = document.getElementById("editEmail").value.trim();

  if(!newName || !newEmail){
    alert("Fill all fields");
    return;
  }

  localStorage.setItem("fadss_logged_user", newName);
  localStorage.setItem("fadss_logged_email", newEmail);
  localStorage.setItem("fadss_profile_img", newPfp);

  alert("Profile updated!");
  window.location.href = "profile.html";
}

function goBack(){
  window.location.href = "profile.html";
}
</script>

</body>
</html>
