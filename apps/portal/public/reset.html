<!DOCTYPE html>
<html>
<head>
<title>Reset Password</title>
<style>
body {
  background:#0b0e11;
  font-family: Arial;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.box {
  background:rgba(255,255,255,0.1);
  padding:30px;
  border-radius:15px;
  width:330px;
  text-align:center;
}

input {
  width:100%;
  padding:12px;
  border-radius:10px;
  border:none;
  margin-top:10px;
}

button {
  width:100%;
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#0dd9e7;
  border:none;
  font-weight:bold;
  cursor:pointer;
}

</style>
</head>

<body>

<div class="box">
  <h2>Reset Password</h2>
  <p>Enter the code sent to your email</p>

  <input id="code" type="text" placeholder="Verification Code">
  <input id="newPass" type="password" placeholder="New Password">

  <button onclick="verifyAndReset()">Reset Password</button>

  <p id="msg"></p>
</div>

<script>
async function verifyAndReset(){
  const email = localStorage.getItem("reset_email");
  const code = document.getElementById("code").value;
  const newPassword = document.getElementById("newPass").value;

  if (!email) {
    alert("Session expired. Try again.");
    window.location.href = "forgot.html";
    return;
  }

  if (!code) {
    document.getElementById("msg").innerText = "Enter verification code";
    return;
  }

  if (!newPassword) {
    document.getElementById("msg").innerText = "Enter a new password";
    return;
  }

  // Verify code
  let verify = await fetch("/verify-reset-code", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, code })
  });

  let vData = await verify.json();

  if(!vData.success){
    document.getElementById("msg").innerText = vData.msg;
    return;
  }

  // Reset password
  let reset = await fetch("/reset-password", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ email, newPassword })
  });

  let rData = await reset.json();

  if (rData.success) {
    alert("Password updated!");
    window.location.assign("login.html");
  } else {
    document.getElementById("msg").innerText = rData.msg || "Failed to update password";
  }
}
</script>


</body>
</html>
