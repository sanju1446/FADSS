<!DOCTYPE html>
<html>
<head>
<title>Edit Profile</title>
<style>
body{
  background:#0b0e11;
  color:white;
  font-family:'Inter';
  padding:40px;
}

.card{
  background:#11181e;
  width:350px;
  padding:20px;
  border-radius:20px;
  text-align:center;
}

.card img{
  width:130px;
  height:130px;
  border-radius:50%;
  object-fit:cover;
  margin-bottom:15px;
}

input{
  width:100%;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  border:none;
  background:#1a2024;
  color:white;
}

button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:none;
  border-radius:10px;
  background:#0dd9e7;
  font-weight:700;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="card">
  <img id="profileImg" src="https://via.placeholder.com/150">

  <input id="editName" placeholder="New Username">
  <input id="editEmail" placeholder="New Email">

  <h3>Change Profile Picture</h3>
  <input type="file" id="uploadPfp" accept="image/*">

  <button onclick="saveProfile()">Save Changes</button>
  <button style="background:#444;" onclick="goBack()">Cancel</button>
</div>

<script>
const token = localStorage.getItem("fadss_token");
if (!token) window.location.href = "login.html";

async function loadEditProfile(){
  try {
    const res = await fetch("/api/me", {
      headers: { "Authorization": "Bearer " + token }
    });
    const data = await res.json();
    if (!data.success) throw new Error();
    const u = data.user;

    document.getElementById("editName").value = u.username || "";
    document.getElementById("editEmail").value = u.email || "";
    if (u.pfp) {
      document.getElementById("profileImg").src = u.pfp;
      localStorage.setItem("fadss_profile_img", u.pfp);
    }
  } catch {
    window.location.href = "login.html";
  }
}

loadEditProfile();

let newPfpFile = null;

// handle image upload (preview only; upload on save)
document.getElementById("uploadPfp").addEventListener("change", function(e){
  const file = e.target.files[0];
  if (!file) return;
  newPfpFile = file;

  const reader = new FileReader();
  reader.onload = function(){
    document.getElementById("profileImg").src = reader.result;
  };
  reader.readAsDataURL(file);
});

// save profile changes (name/email still local only, pfp via backend)
async function saveProfile(){
  const newName = document.getElementById("editName").value.trim();
  const newEmail = document.getElementById("editEmail").value.trim();

  if(!newName || !newEmail){
    alert("Fill all fields");
    return;
  }

  // keep compatibility with existing flows
  localStorage.setItem("fadss_logged_user", newName);
  localStorage.setItem("fadss_logged_email", newEmail);

  if (newPfpFile) {
    const form = new FormData();
    form.append("pfp", newPfpFile);
    try {
      const res = await fetch("/api/profile/picture", {
        method: "POST",
        headers: { "Authorization": "Bearer " + token },
        body: form
      });
      const data = await res.json();
      if (!data.success) {
        alert(data.msg || "Failed to upload picture");
        return;
      }
      if (data.pfp) {
        localStorage.setItem("fadss_profile_img", data.pfp);
      }
    } catch {
      alert("Could not upload picture. Try again.");
      return;
    }
  }

  alert("Profile updated!");
  window.location.href = "profile.html";
}

function goBack(){
  window.location.href = "profile.html";
}
</script>

</body>
</html>
