<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Crop Recommendation</title>

  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --muted: #95a0b5;
      --accent1: #22c1c3;
      --accent2: #6a82fb;
      --glass: rgba(255, 255, 255, 0.04);
      --glass-2: rgba(255, 255, 255, 0.03);
      --success: #4ade80;
      --danger: #fb7185;
      --radius: 14px;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
    }

    body {
      background: linear-gradient(180deg, #071126 0%, #071a2b 60%);
      color: #e7eef8;
      font-family: Inter, sans-serif;
      padding: 40px;
    }

    .container {
      max-width: 700px;
      margin: auto;
      background: var(--card);
      padding: 30px;
      border-radius: var(--radius);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--glass);
    }

    h2 {
      text-align: center;
      color: var(--accent2);
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: 600;
      color: var(--muted);
    }

    small {
      font-size: 12px;
      color: #c5cede;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: var(--radius);
      background: var(--glass);
      border: 1px solid var(--glass-2);
      color: white;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: var(--accent1);
    }

    button {
      margin-top: 28px;
      width: 100%;
      padding: 14px;
      background: linear-gradient(45deg, var(--accent1), var(--accent2));
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-size: 18px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      opacity: 0.9;
    }

    #result {
      margin-top: 24px;
      padding: 16px;
      border-radius: var(--radius);
      display: none;
      background: rgba(34, 193, 195, 0.12);
      border: 1px solid var(--accent1);
      color: #c4f6ff;
      font-size: 18px;
      text-align: center;
    }

    /* Image styling */
    #cropImageBox {
      margin-top: 20px;
      text-align: center;
      display: none;
    }

    #cropImage {
      width: 250px;
      border-radius: 14px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h2>Crop & Fertilizer Recommendation</h2>

    <form id="cropForm">

      <label>Soil pH <small>(Range: 3 – 10)</small></label>
      <input type="number" step="0.01" id="ph" min="3" max="10" required>

      <label>Nitrogen (N) <small>(Range: 0 – 200)</small></label>
      <input type="number" id="n" min="0" max="200" required>

      <label>Phosphorus (P) <small>(Range: 0 – 100)</small></label>
      <input type="number" id="p" min="0" max="200" required>

      <label>Potassium (K) <small>(Range: 0 – 100)</small></label>
      <input type="number" id="k" min="0" max="200" required>

      <label>Temperature (°C) <small>(Range: -5 – 50)</small></label>
      <input type="number" id="temperature" step="0.1" min="-5" max="50" required>

      <label>Humidity (%) <small>(Range: 0 – 100)</small></label>
      <input type="number" id="humidity" min="0" max="100" required>

      <button type="submit">Get Recommendation</button>
    </form>

    <div id="result"></div>

    <!-- ⭐ IMAGE BOX (missing earlier, now added) ⭐ -->
    <div id="cropImageBox">
      <img id="cropImage" src="" alt="Crop Image">
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
